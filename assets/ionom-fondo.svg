<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320">
<!-- Marca de agua de IonNom: compuestos inorgánicos reales en estilo
     ball-and-stick plano "premium": esferas con degradado radial suave
     (no 3D glossy de foto de stock) en la paleta pedagógica Wong/Okabe-Ito
     ya usada en toda la plataforma: ámbar = catión, azul = anión simple,
     rosado = hidróxido, verde = especie covalente/oxoanión; enlaces como
     varillas grises finas detrás de las esferas. Son los mismos 8
     compuestos y la misma conectividad química verificada de la versión
     anterior en Lewis (CO2, H2SO4, NaCl, Ca(OH)2, SO3, HNO3, HCl, CaCO3),
     solo con otra técnica de dibujo. Separación mínima entre compuestos
     (incluidas las copias vecinas del mosaico al repetirse) verificada
     por script (gen_ballstick.py): sin violaciones, margen real de
     ~180px sobre el umbral de 18px. -->
<defs>
  <radialGradient id="g-cat" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#ffdf9e"/><stop offset="100%" stop-color="#E69F00"/></radialGradient>
  <radialGradient id="g-an" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#8fd1f0"/><stop offset="100%" stop-color="#0072B2"/></radialGradient>
  <radialGradient id="g-oh" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#f2cde4"/><stop offset="100%" stop-color="#CC79A7"/></radialGradient>
  <radialGradient id="g-ox" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#7fe0c4"/><stop offset="100%" stop-color="#009E73"/></radialGradient>
</defs>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- CO2 -->
  <g class="mol" transform="translate(120 100) rotate(-6)">
    <line x1="-38" y1="0" x2="0" y2="0" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="38" y2="0" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-38" cy="0" r="11" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="9" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="38" cy="0" r="11" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- H2SO4 -->
  <g class="mol" transform="translate(120 470) rotate(4)">
    <line x1="0" y1="0" x2="-21" y2="-27" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="21" y2="-27" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-33" y2="20" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="33" y2="20" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-33" y1="20" x2="-50" y2="38" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="33" y1="20" x2="50" y2="38" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="-21" cy="-27" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="21" cy="-27" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="-33" cy="20" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="33" cy="20" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="-50" cy="38" r="6" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="50" cy="38" r="6" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- NaCl -->
  <g class="mol" transform="translate(110 800) rotate(-5)">
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-20" cy="0" r="11" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="20" cy="0" r="13" fill="url(#g-an)" stroke="#0072B2" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- Ca(OH)2 -->
  <g class="mol" transform="translate(115 1120) rotate(6)">
    <line x1="0" y1="0" x2="35" y2="-15" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="35" y2="15" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="35" y1="-15" x2="55" y2="-25" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="35" y1="15" x2="55" y2="25" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="13" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="35" cy="-15" r="8" fill="url(#g-oh)" stroke="#CC79A7" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="55" cy="-25" r="5" fill="url(#g-oh)" stroke="#CC79A7" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="35" cy="15" r="8" fill="url(#g-oh)" stroke="#CC79A7" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="55" cy="25" r="5" fill="url(#g-oh)" stroke="#CC79A7" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- SO3 -->
  <g class="mol" transform="translate(575 240) rotate(5)">
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="28" y2="16" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-28" y2="16" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="0" cy="-32" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="28" cy="16" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="-28" cy="16" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- HNO3 -->
  <g class="mol" transform="translate(555 570) rotate(-4)">
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="28" y2="14" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-28" y2="14" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-28" y1="14" x2="-48" y2="30" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="0" cy="-30" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="28" cy="14" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="-28" cy="14" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="-48" cy="30" r="6" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- HCl -->
  <g class="mol" transform="translate(605 900) rotate(3)">
    <line x1="-22" y1="0" x2="18" y2="0" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-22" cy="0" r="6" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="18" cy="0" r="13" fill="url(#g-an)" stroke="#0072B2" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- CaCO3 -->
  <g class="mol" transform="translate(560 1220) rotate(-5)">
    <line x1="-45" y1="0" x2="0" y2="14" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="25" y2="-28" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="50" y2="14" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="0" y2="14" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-45" cy="0" r="12" fill="url(#g-cat)" stroke="#E69F00" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="25" cy="0" r="8" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="25" cy="-28" r="7" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="50" cy="14" r="7" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="0" cy="14" r="7" fill="url(#g-ox)" stroke="#009E73" stroke-width="1" stroke-opacity="0.35"/>
  </g>
</g>
</svg>
